services:
  postgres-test:
    image: postgres:18.7
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_USER: ${ENVOY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ENVOY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ENVOY_POSTGRES_DB}
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
  test-migrate:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    env_file:
      - path: .env
        required: true
    environment:
      ENVOY_DATABASE_URL: ${ENVOY_TEST_DATABASE_URL}
    depends_on:
      postgres-test:
        condition: service_healthy
    command: [alembic, upgrade, head]
    restart: 'no'
  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    env_file:
      - path: .env
        required: true
    environment:
      ENVOY_TEST_DATABASE_URL: ${ENVOY_TEST_DATABASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
      test-migrate:
        condition: service_completed_successfully
    command:
      - sh
      - -ec
      - >-
        black --check . && ruff check && mypy && lint-imports && pytest
        && coverage report --include='*/envoy/journal/*,*/envoy/crypto/*' --fail-under=90
        && coverage json -o .coverage.json && python scripts/check_coverage.py .coverage.json
