<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark}
body{margin:0;padding:10px 12px;font:var(--tg-text-font-size,14px)/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tg-theme-text-color,#000);background:var(--tg-theme-bg-color,#fff);overflow-wrap:anywhere}
h1{font-size:1em;margin:0 0 6px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.s{min-height:36px;border:1px solid var(--tg-theme-hint-color,#999);border-radius:8px;background:none;color:inherit;font:inherit;font-size:.86em}
.s.on{background:var(--tg-theme-button-color,#3390ec);color:var(--tg-theme-button-text-color,#fff);border-color:transparent}
.w{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--tg-theme-section-separator-color,#e7e7ea)}
.w span{flex:1}
.w b{min-width:3em;text-align:center;font-variant-numeric:tabular-nums}
.w button{width:36px;height:32px;border:0;border-radius:8px;font:inherit;background:var(--tg-theme-secondary-bg-color,#f1f1f4);color:inherit}
.save{margin-top:8px;width:100%;min-height:40px;border:0;border-radius:10px;font:inherit;font-weight:600;color:var(--tg-theme-button-text-color,#fff);background:var(--tg-theme-button-color,#3390ec)}
button:disabled{opacity:var(--tg-button-disabled-opacity,.5)}
.m{margin-top:6px;min-height:1.35em;font-size:.9em;color:var(--tg-theme-hint-color,#707579)}
</style>
</head>
<body>
<h1>Черновик мандата</h1>
<div class="g" id="slots"></div>
<div id="issues"></div>
<button class="save" id="save" type="button">Сохранить черновик</button>
<div class="m" id="msg">Активная версия не меняется до подписи в Mini App.</div>
<script>
(function(){
var W=window.TelegramWidget,R=-1,D=null,on=[],delta=[],busy=false;
var N={time:"время",place:"место"};
var A={ok:"Черновик сохранён — подпишите его в Mini App",stale:"Карточка устарела",no:"Недоступно",bad:"Изменение отклонено",error:"Не удалось, попробуйте ещё раз"};
function $(i){return document.getElementById(i)}
function msg(x){$("msg").textContent=x||""}
function b64(bytes){var s="";for(var i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function request(){
var mask=0;for(var i=0;i<on.length;i++)if(on[i])mask=(mask|(1<<i))>>>0;
var m=[mask>>>24&255,mask>>>16&255,mask>>>8&255,mask&255];
var d=delta.map(function(x){return x&255});
return "m:"+D.r.toString(36)+":"+b64(m)+":"+b64(d)}
function draw(){
var d;try{d=JSON.parse(W.chatData||"null")}catch(e){return}
if(!d||typeof d.r!=="number"||d.r<R)return;R=d.r;D=d;
on=(d.slots||[]).map(function(s){return !!s.on});delta=(d.issues||[]).map(function(){return 0});
var g=$("slots");g.textContent="";
(d.slots||[]).forEach(function(s,i){var b=document.createElement("button");b.type="button";b.className="s"+(on[i]?" on":"");b.textContent=String(s.label);
b.onclick=function(){on[i]=!on[i];b.className="s"+(on[i]?" on":"")};g.appendChild(b)});
var box=$("issues");box.textContent="";
(d.issues||[]).forEach(function(name,i){
var r=document.createElement("div"),l=document.createElement("span"),v=document.createElement("b"),minus=document.createElement("button"),plus=document.createElement("button");
r.className="w";l.textContent="Важность: "+(N[name]||String(name));v.textContent="±0";minus.textContent="−";plus.textContent="+";minus.type=plus.type="button";
function step(x){delta[i]=Math.max(-100,Math.min(100,delta[i]+x));v.textContent=(delta[i]>0?"+":delta[i]<0?"":"±")+delta[i]}
minus.onclick=function(){step(-1)};plus.onclick=function(){step(1)};
r.appendChild(l);r.appendChild(minus);r.appendChild(v);r.appendChild(plus);box.appendChild(r)});
busy=false;$("save").disabled=false}
$("save").onclick=function(){
if(busy||!D)return;if(on.indexOf(true)<0){msg("Оставьте хотя бы одно время");return}
busy=true;$("save").disabled=true;msg("Сохраняю…");
try{W.request(request()).then(function(a){var r=a&&a.result;msg(A[r]||A.bad);if(r!=="ok"){busy=false;$("save").disabled=false}},
function(e){busy=false;$("save").disabled=false;msg(e&&e.code==="BUSY"?"Подождите":"Не удалось отправить")})}
catch(e){busy=false;$("save").disabled=false;msg("Не удалось отправить")}};
W.onEvent("chatDataChanged",draw);draw();if(W.ready)W.ready();
})();
</script>
</body>
</html>
