[project]
name = "envoy"
version = "0.1.0"
description = ""
authors = [
    {name = "Вадим Герасименко",email = "vadimik824@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "pydantic (>=2.14.3,<3.0.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "cryptography (>=50.0.2,<51.0.0)",
    "cbor2 (>=6.3.0,<7.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "aiolimiter (>=1.3.0,<2.0.0)",
    "tenacity (>=9.2.1,<10.0.0)",
    "aiohttp (>=3.14.5,<4.0.0)",
    "aiogram (>=3.32.0,<4.0.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "python-stdnum (>=2.2,<3.0)",
    "numpy (>=2.5.5,<3.0.0)",
    "anthropic (>=2.13.0,<3.0.0)",
    "pyyaml (>=6.0.4,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "envoy", from = "src"}, {include = "tg_fake_api", from = "src"}]

[tool.black]
line-length = 100
target-version = ["py315"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "PT", "ERA"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=envoy --cov-branch --record-mode=none -m 'not live_llm'"
markers = ["live_llm: red-team scenarios against the real LLM provider (nightly, budgeted)"]

[tool.coverage.run]
branch = true
source = ["envoy"]

[tool.coverage.report]
show_missing = true

[[tool.mypy.overrides]]
module = ["cbor2", "stdnum.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "hypothesis (>=6.170.15,<7.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.17.0,<4.0.0)",
    "pytest-randomly (>=5.1.0,<6.0.0)",
    "pytest-recording (>=0.15.0,<0.16.0)",
    "vcrpy (>=9.4.2,<10.0.0)",
    "aioresponses (>=0.7.9,<0.8.0)",
    "time-machine (>=3.6.0,<4.0.0)",
    "syrupy (>=7.0.2,<8.0.0)",
    "polyfactory (>=3.5.0,<4.0.0)",
    "testcontainers[postgres] (>=4.15.0,<5.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "ruff (>=0.17.5,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "import-linter (>=2.16,<3.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "types-beautifulsoup4 (>=4.12.0.20250516,<5.0.0.0)",
    "types-pyyaml (>=6.0.12.20261122,<7.0.0.0)"
]
