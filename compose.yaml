name: envoy-phase0
services:
  postgres:
    image: postgres:18.7
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_USER: ${ENVOY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ENVOY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ENVOY_POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    env_file:
      - path: .env
        required: true
    depends_on:
      postgres:
        condition: service_healthy
    command: [alembic, upgrade, head]
    restart: 'no'
volumes:
  postgres-data:
