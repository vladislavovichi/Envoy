name: Red-team nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redteam-nightly
  cancel-in-progress: false

jobs:
  live-llm:
    name: Red-team against live LLM
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ENVOY_LLM_MODEL: ${{ vars.ENVOY_LLM_MODEL || 'claude-opus-5-5' }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python and Poetry
        uses: ./.github/actions/poetry

      - name: Run scripted catalog
        run: poetry run pytest tests/redteam --no-cov

      - name: Run live catalog under budget
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: poetry run pytest tests/redteam --no-cov -m live_llm
