name: Set up Python and Poetry
description: Installs Python and Poetry, restores the virtualenv cache and installs locked dependencies

runs:
  using: composite
  steps:
    - name: Install Poetry
      shell: bash
      run: pipx install poetry==2.2.1

    - name: Set up Python and restore Poetry cache
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'
        cache: poetry
        cache-dependency-path: poetry.lock

    - name: Check lock file
      shell: bash
      run: poetry check --lock

    - name: Install dependencies
      shell: bash
      run: poetry install --no-interaction
